# 로컬 개발용: MariaDB만 컨테이너로 띄우고, Spring Boot는 IDE에서 직접 실행(local 프로필)
services:
  mariadb:
    image: mariadb:11
    container_name: playground-mariadb-local
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 필요}
      MARIADB_DATABASE: playground_local
      MARIADB_USER: playground
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필요}
    ports:
      - '3307:3306'
    volumes:
      - mariadb_local_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: playground-redis-local
    restart: unless-stopped
    ports:
      - '6380:6379'

volumes:
  mariadb_local_data:
