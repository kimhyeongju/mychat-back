spring:
  application:
    name: khj-playground
  profiles:
    active: local
  web:
    error:
      # 기본값(never)이면 ResponseStatusException의 메시지(예: "이미 사용 중인 아이디입니다")가
      # 콘솔 로그에만 남고 응답 JSON에는 빠져서, 프론트가 항상 "요청에 실패했습니다" 같은
      # 일반 메시지만 받게 된다. always로 바꿔서 실제 예외 메시지가 body의 "message" 필드로 내려가게 한다.
      include-message: always
      include-binding-errors: always

  flyway:
    enabled: true
    out-of-order: true
    locations:
      - classpath:db/migration/auth
      - classpath:db/migration/chat
      - classpath:db/migration/board
      - classpath:db/migration/invest

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
invest:
  # 가입 시 지급하는 가상 자금 (USD)
  seed-money: 100000
  market-data:
    # alpaca | finnhub | fake. 키가 없는 환경에서는 fake 로 두면 서버가 가상 시세를 만든다.
    provider: ${INVEST_MARKET_DATA_PROVIDER:fake}
    # 외부 시세 API 서버 전체 호출 한도(분당). Finnhub 무료 60 → 50, Alpaca 무료 200 → 150.
    calls-per-minute: ${INVEST_CALLS_PER_MINUTE:50}
    # 보유 종목 시세를 갱신하는 주기(ms). 일괄 조회가 되는 Alpaca 는 15000 까지 줄여도 된다.
    refresh-interval-ms: ${INVEST_REFRESH_INTERVAL_MS:60000}
    finnhub:
      api-key: ${FINNHUB_API_KEY:}
    alpaca:
      key-id: ${ALPACA_API_KEY_ID:}
      secret: ${ALPACA_API_SECRET_KEY:}
      # 무료 계정은 iex. 모의(paper) 계정 키는 trading-url 이 paper-api 여야 한다.
      feed: iex

server:
  port: 8080
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  # Pageable을 page/size/sort 개별 쿼리 파라미터로 표시한다.
  default-flat-param-object: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.khj.playground: debug
