spring:
  application:
    name: khj-playground
  profiles:
    active: local
  web:
    error:
      # 기본값(never)이면 ResponseStatusException의 메시지(예: "이미 사용 중인 아이디입니다")가
      # 콘솔 로그에만 남고 응답 JSON에는 빠져서, 프론트가 항상 "요청에 실패했습니다" 같은
      # 일반 메시지만 받게 된다. always로 바꿔서 실제 예외 메시지가 body의 "message" 필드로 내려가게 한다.
      include-message: always
      include-binding-errors: always

  flyway:
    enabled: true
    out-of-order: true
    locations:
      - classpath:db/migration/auth
      # board, invest 모듈 착수 시 아래를 추가한다
      - classpath:db/migration/chat
      - classpath:db/migration/board
    # - classpath:db/migration/invest

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}

server:
  port: 8080
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  # Pageable을 page/size/sort 개별 쿼리 파라미터로 표시한다.
  default-flat-param-object: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.khj.playground: debug
