spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:mariadb}:${DB_PORT:3306}/${DB_NAME:playground_dev}
    username: ${DB_USERNAME:playground}
    password: ${DB_PASSWORD:753951}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-please-change-this-in-real-env-32bytes+}
  access-token-expiration-ms: 1800000
  refresh-token-expiration-ms: 1209600000

chat:
  websocket:
    allowed-origins: http://localhost:3000,http://localhost:8080
