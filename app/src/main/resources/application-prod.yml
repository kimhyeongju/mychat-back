spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:1800000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:1209600000}

sms:
  solapi:
    api-key: ${SOLAPI_API_KEY}
    api-secret: ${SOLAPI_API_SECRET}
    sender: ${SOLAPI_SENDER}

invest:
  market-data:
    # alpaca(기본) | finnhub. 키는 기본값 없이 반드시 환경변수로 받는다.
    provider: ${INVEST_MARKET_DATA_PROVIDER:alpaca}
    calls-per-minute: ${INVEST_CALLS_PER_MINUTE:150}
    refresh-interval-ms: ${INVEST_REFRESH_INTERVAL_MS:15000}
    finnhub:
      api-key: ${FINNHUB_API_KEY:}
    alpaca:
      key-id: ${ALPACA_API_KEY_ID:}
      secret: ${ALPACA_API_SECRET_KEY:}
chat:
  websocket:
    # Cloudflare Tunnel을 통해 같은 오리진으로 들어온다.
    allowed-origins: https://khj-playground.site

logging:
  level:
    com.khj.playground: info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
