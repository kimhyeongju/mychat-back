spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:1800000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:1209600000}

sms:
  solapi:
    api-key: ${SOLAPI_API_KEY}
    api-secret: ${SOLAPI_API_SECRET}
    sender: ${SOLAPI_SENDER}

chat:
  websocket:
    # Cloudflare Tunnel을 통해 같은 오리진으로 들어온다.
    allowed-origins: https://khj-playground.site

logging:
  level:
    com.khj.playground: info
