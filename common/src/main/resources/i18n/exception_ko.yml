# 공통 오류. 코드 대역 9xxx. 모듈별 오류는 각 모듈의 i18n/exception_ko.yml 에 둔다.
unauthorized:
  code: '9001'
  message: '로그인이 필요하거나 로그인이 만료되었습니다. 다시 로그인해주세요.'

forbidden:
  code: '9002'
  message: '권한이 없습니다.'

validation-error:
  code: '9003'
  message: '입력값이 올바르지 않습니다.'

malformed-request:
