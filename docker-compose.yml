# 백엔드 컨테이너 + MariaDB를 함께 띄워 "실제 배포와 유사한 형태"로 확인할 때 사용.
# 순수 코드 개발 중에는 docker-compose.local.yml(DB만)을 쓰고 IDE에서 앱을 직접 실행하는 걸 권장.
services:
  mariadb:
    image: mariadb:11
    container_name: mychat-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: 753951
      MARIADB_DATABASE: mychat_dev
      MARIADB_USER: mychat
      MARIADB_PASSWORD: 753951
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mychat-redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: mychat-back
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: mychat_dev
      DB_USERNAME: mychat
      DB_PASSWORD: 753951
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '8080:8080'

volumes:
  mariadb_data:
