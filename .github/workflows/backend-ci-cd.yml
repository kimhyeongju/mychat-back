name: Backend CI/CD

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build jar
        run: ./gradlew bootJar --no-daemon

  docker-build-push:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mychat-back:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mychat-back:${{ steps.vars.outputs.sha_short }}

  deploy:
    name: Deploy to Home Server
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, minipc]
    steps:
      - name: Pull latest image & restart
        run: |
          docker compose -f /opt/mychat/docker-compose.prod.yml pull backend
          docker compose -f /opt/mychat/docker-compose.prod.yml up -d backend
